server {
    listen 80;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    add_header X-Lab "set at server level";

    location = /hello {
        default_type text/plain;
        return 200 "Hello from a rule, not a file\n";
    }

    location /api/ {
        # Step 10: try these one at a time and compare the GET line whoami prints:
        #   proxy_pass http://backend;
        #   proxy_pass http://backend/;
        #   (and 'location /api' without trailing slash + 'http://backend/')
        proxy_pass http://backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Worker $pid;          # which worker answered
    }
}
