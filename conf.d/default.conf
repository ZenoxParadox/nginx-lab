# ---- definitions (http level: outside any server block) ----
limit_req_zone $binary_remote_addr zone=perip:10m rate=1r/s;

proxy_cache_path /var/cache/nginx/lab keys_zone=labcache:10m;

upstream app {
    zone app 64k;          # workers share one turn counter
    server backend:80;     # every backend container behind this name
}

map $http_x_refresh $do_refresh {
    default            0;
    "my-secret-token"  1;    # lab only: see step 21 on keeping secrets out of Git
}

map $http_authorization $auth_ok {
    default               0;
    "Bearer token-alice"  1;
    "Bearer token-bob"    1;
}

limit_req_zone $http_authorization zone=pertoken:10m rate=1r/s;

# Plain HTTP only redirects. 302 while experimenting, 301 once sure.
# The lab adds :8443 because of the Docker port mapping; production: https://$host$request_uri
server {
    listen 80 default_server;
    return 302 https://$host:8443$request_uri;
}

server {
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    http2 on;
    server_tokens off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    add_header X-Lab "set at server level";

    location = /hello {
        default_type text/plain;
        return 200 "Hello from a rule, not a file\n";
    }

    location /api/ {
        proxy_pass http://app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Worker $pid;          # which worker answered
        add_header X-Upstream $upstream_addr always;   # which backend(s) were tried
        proxy_connect_timeout 2s;          # default is 60s
        # proxy_read_timeout 1s;           # step 19 follow-up: try with ?wait=3s
        client_max_body_size 10m;          # comment out to see the default
    }

    location /match/ {
        default_type text/plain;
        return 200 "A: prefix /match/\n";
    }

    location /match/images/ {
        default_type text/plain;
        return 200 "B: longer prefix /match/images/\n";
    }

    location ~ \.png$ {
        default_type text/plain;
        return 200 "C: regex, ends in .png\n";
    }

    location = /match/exact {
        default_type text/plain;
        return 200 "D: exact match\n";
    }

    location ^~ /match/static/ {
        default_type text/plain;
        return 200 "E: prefix with ^~\n";
    }

    location /limited/ {
        limit_req zone=perip burst=5;      # try: no burst / burst=5 / burst=5 nodelay
        limit_req_status 429;              # default would be 503
        proxy_pass http://backend;
    }

    # Step 14: location and alias must end the same way. Prefer root over alias when you can.
    location /files/ {
        alias /usr/share/nginx/html/;
    }

    location /cached/ {
        proxy_cache labcache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout;
        proxy_connect_timeout 1s;
        proxy_no_cache     $http_x_user;
        proxy_cache_bypass $http_x_user $do_refresh;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://backend;
    }

    # Lab stand-in for a real auth service (see the reveal in STEP.md)
    location = /_auth {
        internal;
        if ($auth_ok) {
            return 204;
        }
        return 401;
    }

    location /secure/ {
        auth_request /_auth;
        # limit_req zone=perip    burst=10 nodelay;   # outer guard, see the reveal
        limit_req zone=pertoken burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://app;
    }
}
